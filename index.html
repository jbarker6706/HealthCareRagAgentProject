<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clinical Hybrid RAG Dashboard</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f5f7fb; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        h1 { color: #1e293b; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; font-size: 24px; }
        .chat-box { height: 450px; overflow-y: auto; border: 1px solid #e2e8f0; border-radius: 8px; padding: 15px; margin-bottom: 20px; background: #fafafa; display: flex; flex-direction: column; gap: 12px; }
        .message { padding: 12px 16px; border-radius: 8px; max-width: 80%; line-height: 1.5; white-space: pre-wrap; }
        .user { background: #0284c7; color: white; align-self: flex-end; }
        .agent { background: #f1f5f9; color: #334155; align-self: flex-start; border-left: 4px solid #0d9488; font-family: monospace; }
        .input-area { display: flex; gap: 10px; }
        input { flex: 1; padding: 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 16px; }
        button { background: #0d9488; color: white; border: none; padding: 12px 24px; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: 600; }
        button:hover { background: #0f766e; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏥 Open-Source Clinical Hybrid RAG Dashboard (Rev 2)</h1>
        <div class="chat-box" id="chatBox">
            <div class="message agent">System ready. Enter a clinical query or patient lookup request below.</div>
        </div>
        <div class="input-area">
            <input type="text" id="userInput" placeholder="Ask about patient records or medical guidelines..." onkeydown="if(event.key === 'Enter') sendMessage()">
            <button onclick="sendMessage()">Send Query</button>
        </div>
    </div>

    <script>
        async function sendMessage() {
            const inputElement = document.getElementById('userInput');
            const chatBox = document.getElementById('chatBox');
            const messageText = inputElement.value.trim();
            if (!messageText) return;

            // Append User Message
            appendMessage(messageText, 'user');
            inputElement.value = '';

            // Create loading placeholder for agent response
            const loadingDiv = appendMessage("Thinking and querying database...", 'agent');

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: messageText, thread_id: "gradio_local_session" })
                });

                const data = await response.json();
                if (response.ok) {
                    loadingDiv.innerText = data.response;
                } else {
                    loadingDiv.innerText = `⚠️ Error: ${data.detail}`;
                }
            } catch (err) {
                loadingDiv.innerText = `⚠️ Network Connection Error: ${err.message}`;
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function appendMessage(text, sender) {
            const chatBox = document.getElementById('chatBox');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender}`;
            msgDiv.innerText = text;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
            return msgDiv;
        }
    </script>
</body>
</html>
